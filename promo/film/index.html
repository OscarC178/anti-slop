<!doctype html>
<html lang="en-GB" data-composition-variables='[{"id":"cta","type":"string","label":"Button","default":"Free for Chrome"},{"id":"url","type":"string","label":"Web address","default":"oscarc178.github.io/anti-slop"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #f3f2ef; }
      #root { width: 100%; height: 100%; position: relative; background: #f3f2ef; font-family: Inter, sans-serif; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="52" data-width="1920" data-height="1080">
      <div id="slop" data-composition-id="slop" data-composition-src="compositions/slop.html" data-start="0" data-duration="14" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="fold" data-composition-id="fold" data-composition-src="compositions/fold.html" data-start="14" data-duration="8.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="xfold" data-composition-id="xfold" data-composition-src="compositions/xfold.html" data-start="22.5" data-duration="6" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="show" data-composition-id="show" data-composition-src="compositions/show.html" data-start="28.5" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="control" data-composition-id="control" data-composition-src="compositions/control.html" data-start="34.5" data-duration="5.5" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="clean" data-composition-id="clean" data-composition-src="compositions/clean.html" data-start="40" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html" data-start="46" data-duration="6" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <audio id="music-bed" src="assets/music-bed.wav" data-start="0" data-duration="52" data-track-index="2" data-volume="0.85"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
